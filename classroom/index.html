function startLoadingHumor(){
 if(config.mode==='admin')return ()=>{};
 const host=$('#app');
 host.innerHTML='<div class="loading loading-humor" id="loadingHumor" aria-label="강의 자료 로딩 중"><div aria-hidden="true"><p class="loading-question"></p><p class="loading-answer"></p></div><p class="visually-hidden loading-announcement" role="status" aria-live="polite" aria-atomic="true"></p></div>';
 const root=$('#loadingHumor'),question=root.querySelector('.loading-question'),answer=root.querySelector('.loading-answer'),announcement=root.querySelector('.loading-announcement');
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 let deck=[],lastId='',timeout,stopped=false;
 function later(fn,delay){timeout=setTimeout(()=>{if(!stopped&&root.isConnected)fn();},delay);}
 function pick(){
  if(!deck.length){deck=loadingQuizzes.slice();for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}if(deck.length>1&&deck.at(-1).id===lastId)[deck[0],deck[deck.length-1]]=[deck[deck.length-1],deck[0]];}
  const item=deck.pop();lastId=item.id;return item;
 }
 function type(el,text,interval,done){
  if(reduced){el.textContent=text;done();return;}
  const chars=Array.from(text);let index=0;
  function step(){el.textContent+=chars[index++];if(index<chars.length)later(step,interval);else done();}
  step();
 }
 function next(){
  const item=pick();question.textContent='';answer.textContent='';announcement.textContent='';
  type(question,item.question,60,()=>{announcement.textContent=item.question;later(()=>type(answer,item.answer,70,()=>{announcement.textContent=item.question+' '+item.answer;later(next,2500);}),1000);});
 }
 function stop(){stopped=true;clearTimeout(timeout);window.removeEventListener('pagehide',stop);if(root.isConnected)root.remove();}
 window.addEventListener('pagehide',stop,{once:true});
 next();return stop;
}

async function rpc(name,...args){
 if(demo)return demoRpc(name,...args);
 if(config.mode==='student'&&name!=='getPublic')throw new Error('선생님 관리 화면에서 이용해 주세요.');
 const response=await fetch(config.api,{method:config.mode==='student'?'GET':'POST',credentials:config.mode==='student'?'omit':'same-origin',headers:config.mode==='student'?{}:{'Content-Type':'application/json'},body:config.mode==='student'?undefined:JSON.stringify({action:name,args}),redirect:'follow'});
 const payload=await response.json();if(!response.ok||!payload.ok)throw new Error(payload.error||'자료를 불러오지 못했습니다.');return payload.result;
}

function localAddress(params){const u=new URL(location.href);u.search='';u.hash='';Object.entries(params).forEach(([k,v])=>{if(v)u.searchParams.set(k,v);});return u.href;}
function address(params){const u=new URL(config.publicUrl||baseUrl||location.href);u.search='';u.hash='';Object.entries(params).forEach(([k,v])=>{if(v)u.searchParams.set(k,v);});return u.href;}
function navigate(params,replace=false){route=params;history[replace?'replaceState':'pushState']({},'',localAddress(params));query='';render();window.scrollTo({top:0});}
function loadRoute(params){route={course:params.course||'',lesson:params.lesson||'',assignment:params.assignment||''};render();if(route.lesson){const lesson=data.lessons.find(x=>x.id===route.lesson&&visible(x));if(lesson)openVideo(lesson.id,false);else message('이 강의는 현재 공개되어 있지 않습니다.');}}
function courseName(id){return data.courses.find(x=>x.id===id)?.title||'';}
function unitTitle(u){return /^\(\d+\)\s/.test(u.title)?u.title:`(${u.sortOrder+1}) ${u.title}`;}
function titleOf(l){return l.title.replace(/^\[[^\]]+\]\s*/,'').replace(/\s*\([^)]*(?:p\.|풍산자|개념원리)[^)]*\)\s*$/i,'').trim()||l.title;}
function publicLessons(){const cs=new Set(data.courses.filter(visible).map(x=>x.id)),us=new Set(data.units.filter(x=>visible(x)&&cs.has(x.courseId)).map(x=>x.id));return data.lessons.filter(x=>visible(x)&&us.has(x.unitId));}
function latestLessons(courseId=''){return publicLessons().filter(l=>l.createdAt&&Number.isFinite(Date.parse(l.createdAt))&&(!courseId||l.courseId===courseId)).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt)||b.sortOrder-a.sortOrder||a.id.localeCompare(b.id));}
function additionDate(l){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(l.createdAt));}
function uploadRows(items){return items.map(l=>`<button class="upload-link" data-upload-play="${esc(l.id)}"><span class="upload-label"><span class="upload-course">${esc(courseName(l.courseId))}</span><span class="upload-title">${esc(titleOf(l))}</span></span><time datetime="${esc(l.createdAt)}">${esc(additionDate(l).slice(5).replace('-','/'))}</time></button>`).join('');}
function uploadsBoard(courseId=''){const items=latestLessons(courseId);return `<details class="uploads" data-uploads-scope="${esc(courseId)}" ${openUploads.has(courseId)?'open':''}><summary class="uploads-toggle"><h2>최근 추가된 영상</h2><span class="uploads-arrow" aria-hidden="true">⌄</span></summary><div class="uploads-content"><div class="uploads-head"><p class="meta">최신 ${Math.min(5,items.length)}개 영상</p>${items.length>5?'<button data-more-uploads>더 보기</button>':''}</div><div class="upload-list">${items.length?uploadRows(items.slice(0,5)):'<p class="notice-empty">최근 추가된 영상이 없습니다.</p>'}</div></div></details>`;}
function showUploads(){const items=latestLessons(route.course).slice(0,20);openDialog('최근 추가된 영상',`<div class="upload-list">${uploadRows(items)}</div>`,true);}
function openUpload(id){if($('#modal').open&&!playerId)closeDialog(false);playerList=latestLessons(route.course);openVideo(id);}
function matches(l,q){const normalized=q.normalize('NFC').toLowerCase().replace(/\s/g,'');const text=[l.title,l.pages,courseName(l.courseId),data.courses.find(x=>x.id===l.courseId)?.book].join(' ').normalize('NFC').toLowerCase().replace(/\s/g,'');if(text.includes(normalized))return true;const p=q.match(/^(?:p\.?\s*)?(\d+)\s*쪽?$/i);if(p){const n=Number(p[1]),ranges=[...l.pages.matchAll(/p\.?\s*(\d+)(?:\s*[~\-–]\s*(\d+))?/gi)];return ranges.some(m=>n>=Number(m[1])&&n<=Number(m[2]||m[1]));}return false;}
function lessonRow(l,i){return `<article class="lesson"><span class="num">${String(i+1).padStart(2,'0')}</span><div><h3><button class="title" data-play="${esc(l.id)}">${esc(titleOf(l))}</button></h3><p>${esc(l.pages)}${!route.course?' · '+esc(courseName(l.courseId)):''}</p></div><div class="actions"><button class="primary" data-play="${esc(l.id)}">영상 보기</button><button data-copy-lesson="${esc(l.id)}" aria-label="${esc(titleOf(l))} 링크 복사">링크</button></div></article>`;}
function fileSize(bytes){if(!bytes)return '0 KB';for(const [unit,scale] of [['TB',1024**4],['GB',1024**3],['MB',1024**2]])if(bytes>=scale)return (bytes/scale).toFixed(1)+' '+unit;return Math.max(1,Math.ceil(bytes/1024))+' KB';}
function resourceUrl(file,view=false){if(!/^[-a-zA-Z0-9_]{10,200}$/.test(file.fileId||''))return '';return 'https://drive.google.com/'+(view?'file/d/'+encodeURIComponent(file.fileId)+'/view':'uc?export=download&id='+encodeURIComponent(file.fileId))+(file.resourceKey?(view?'?':'&')+'resourcekey='+encodeURIComponent(file.resourceKey):'');}
function resourceBoard(courseId,manage=false){const items=sort((data.resources||[]).filter(x=>x.courseId===courseId&&(manage?alive(x):visible(x))));return `<section class="resource-board" aria-label="교재 파일"><div class="section-head" style="margin:0"><h2>교재 파일</h2>${manage?'<button class="primary" data-upload-resource>교재 파일 올리기</button>':''}</div>${items.length?items.map(f=>`<article class="resource-row"><div><strong>${esc(f.title)}</strong><small>${esc(f.fileName)} · ${fileSize(f.size)}${manage&&f.hidden?' · 숨김':''}</small></div><div class="actions">${resourceUrl(f)?`<a class="file-download" href="${esc(resourceUrl(f))}" target="_blank" rel="noopener noreferrer" aria-label="${esc(f.title)} 다운로드">다운로드</a>`:''}${manage?editButtons('resources',f):''}</div></article>`).join(''):'<p class="resource-empty">등록된 교재 파일이 없습니다.</p>'}</section>`;}
function renderSearchView(html,id){
 const app=$('#app'),input=document.getElementById(id),search=input?.closest('.search'),next=document.createElement('div');next.innerHTML=html;const replacement=next.querySelector('#'+id)?.closest('.search');
 if(!search||!app.contains(search)||!replacement){app.innerHTML=html;return;}
 const newInput=replacement.querySelector('input');if(document.activeElement!==input&&input.value!==newInput.value)input.value=newInput.value;
 const nodes=Array.from(next.childNodes),index=nodes.indexOf(replacement);while(search.previousSibling)search.previousSibling.remove();while(search.nextSibling)search.nextSibling.remove();search.before(...nodes.slice(0,index));search.after(...nodes.slice(index+1));
}
function bindSearch(input,update){
 if(input.applySearch)return;let pending,composing=false;
 const apply=()=>{clearTimeout(pending);if(!input.isConnected)return;update(input.value);render();};
 const schedule=()=>{clearTimeout(pending);pending=setTimeout(apply,120);};input.applySearch=apply;
 input.oncompositionstart=()=>{composing=true;};input.oncompositionend=()=>{composing=false;schedule();};input.oninput=schedule;input.onsearch=apply;input.onblur=schedule;
 input.onkeydown=e=>{if(e.key==='Enter'&&!composing&&!e.isComposing){e.preventDefault();apply();}};
}

const fileAccept='.pdf,.hwp,.hwpx,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,.png,.jpg,.jpeg';
async function uploadResourceFile(item,courseId,call,progress){
 const file=item.file;
 if(!item.state){item.state=await call('start',{headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id,courseId,title:item.title,fileName:file.name,size:file.size})});item.state.nextOffset=0;}
 const state=item.state,headers={'X-Upload-Token':state.token};
 if(state.nextOffset&&!state.fileId)Object.assign(state,await call('status',{headers}));
 let failures=0;
 while(state.nextOffset<file.size&&!state.fileId){
  const start=state.nextOffset,end=Math.min(start+state.chunkBytes,file.size);progress('업로드 중 '+Math.floor(start/file.size*100)+'% · '+fileSize(start)+' / '+fileSize(file.size));
  try{const result=await call('chunk',{headers:{...headers,'Content-Type':'application/octet-stream','Content-Range':`bytes ${start}-${end-1}/${file.size}`},body:file.slice(start,end)});if(result.nextOffset<=start&&!result.fileId)throw new Error('파일 전송이 진행되지 않았습니다.');Object.assign(state,result);failures=0;}
  catch(e){if(++failures>3)throw e;Object.assign(state,await call('status',{headers}));}
 }
 if(!state.fileId){Object.assign(state,await call('status',{headers}));if(!state.fileId)throw new Error('Drive에서 전송 완료를 확인 중입니다. 다시 올리기를 눌러 주세요.');}
 progress('전송 100% · 교재 목록에 등록 중');
 return (await call('finish',{headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({fileId:state.fileId})})).result;
}
async function uploadResourceBatch(queue,courseId,call,update,registered){
 for(const item of queue){if(item.done)continue;try{update(item,'업로드 준비 중');const result=await uploadResourceFile(item,courseId,call,text=>update(item,text));registered(result);item.done=true;update(item,'완료');}catch(e){update(item,'실패: '+e.message);}}
 return queue.filter(item=>item.done).length;
}

 $('#resourceForm').onsubmit=async e=>{e.preventDefault();if(busy||!queue.length)return;
 let invalid=false;queue.forEach((item,i)=>{if(item.done)return;if(!item.state)item.title=$('#resourceTitle'+i).value.trim();if(!item.title||item.title.length>300||item.file.size<1||!fileAccept.split(',').some(ext=>item.file.name.toLowerCase().endsWith(ext))){status(item,'표시 이름과 지원 파일 형식을 확인해 주세요.');invalid=true;}});if(invalid)return;
 $('#resourceFile').disabled=true;queue.forEach((_,i)=>$('#resourceTitle'+i).disabled=true);
 const completed=await runTask(async()=>{if(demo)throw new Error('게시된 관리자 화면에서 이용해 주세요.');const call=async(path,options={})=>{const response=await fetch('/api/upload/'+path,{method:'POST',credentials:'same-origin',...options});let result;try{result=await response.json();}catch{throw new Error('업로드 연결을 확인해 주세요.');}if(!response.ok||!result.ok)throw new Error(result.error||'파일 전송이 중단됐습니다.');return result;};return uploadResourceBatch(queue,courseId,call,(item,text)=>{status(item,text);$('#uploadProgress').textContent=(queue.indexOf(item)+1)+' / '+queue.length+' · '+item.file.name;},result=>{data=result.data;revision=result.revision;});});
 if(completed===queue.length){closeDialog();render();message(queue.length+'개 교재 파일을 올렸습니다.');return;}

 };
}

let dialogBackdropPress=false;
function outsideDialog(e){const r=$('#modal').getBoundingClientRect();return e.target===$('#modal')&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom);}
