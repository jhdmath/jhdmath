async function uploadResourceFile(item,courseId,call,progress){
 const file=item.file;
 if(!item.state){item.state=await call('start',{headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id,courseId,title:item.title,fileName:file.name,size:file.size})});item.state.nextOffset=0;}
 const state=item.state,headers={'X-Upload-Token':state.token};
 if(state.nextOffset&&!state.fileId)Object.assign(state,await call('status',{headers}));
 let failures=0;
 while(state.nextOffset<file.size&&!state.fileId){
  const start=state.nextOffset,end=Math.min(start+state.chunkBytes,file.size);progress('업로드 중 '+Math.floor(start/file.size*100)+'% · '+fileSize(start)+' / '+fileSize(file.size));
  try{const result=await call('chunk',{headers:{...headers,'Content-Type':'application/octet-stream','Content-Range':`bytes ${start}-${end-1}/${file.size}`},body:file.slice(start,end)});if(result.nextOffset<=start&&!result.fileId)throw new Error('파일 전송이 진행되지 않았습니다.');Object.assign(state,result);failures=0;}
  catch(e){if(++failures>3)throw e;Object.assign(state,await call('status',{headers}));}
 }
 if(!state.fileId){Object.assign(state,await call('status',{headers}));if(!state.fileId)throw new Error('Drive에서 전송 완료를 확인 중입니다. 다시 올리기를 눌러 주세요.');}
 progress('전송 100% · 교재 목록에 등록 중');
 return (await call('finish',{headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({fileId:state.fileId})})).result;
}
async function uploadResourceBatch(queue,courseId,call,update,registered){
 for(const item of queue){if(item.done)continue;try{update(item,'업로드 준비 중');const result=await uploadResourceFile(item,courseId,call,text=>update(item,text));registered(result);item.done=true;update(item,'완료');}catch(e){update(item,'실패: '+e.message);}}
 return queue.filter(item=>item.done).length;
}
function uploadResourceDialog(){
 const courseId=adminCourse;let queue=[];
 openDialog('교재 파일 올리기',`<form class="form" id="resourceForm"><p class="meta">${esc(courseName(courseId))}</p><label>교재 파일 · 여러 개 선택 가능<input id="resourceFile" type="file" accept="${fileAccept}" multiple required></label><div id="resourceQueue"></div><p class="meta">파일별 표시 이름을 수정할 수 있습니다. PDF·한글·Office·ZIP·이미지. 앱의 파일 용량 제한 없이 올릴 수 있습니다. 학생은 로그인 없이 내려받을 수 있습니다.</p><p id="uploadProgress" role="status"></p><div class="actions"><button type="button" data-close>닫기</button><button id="uploadSubmit" type="submit" class="primary">선택한 파일 올리기</button></div></form>`);
 const status=(item,text)=>{item.status=text;$('#resourceStatus'+queue.indexOf(item)).textContent=text;};
 $('#resourceFile').onchange=e=>{queue=Array.from(e.target.files).map(file=>({id:crypto.randomUUID(),file,title:file.name.replace(/\.[^.]+$/,''),done:false}));$('#resourceQueue').innerHTML=queue.map((item,i)=>`<div class="upload-item"><p class="meta">${esc(item.file.name)} · ${fileSize(item.file.size)}</p><label>학생에게 표시할 이름 · ${i+1}<input id="resourceTitle${i}" required maxlength="300" value="${esc(item.title)}"></label><p class="meta" id="resourceStatus${i}" role="status">대기</p></div>`).join('');$('#uploadProgress').textContent=queue.length+'개 파일 선택';$('#uploadSubmit').textContent='선택한 파일 올리기';};
 $('#resourceForm').onsubmit=async e=>{e.preventDefault();if(busy||!queue.length)return;
 let invalid=false;queue.forEach((item,i)=>{if(item.done)return;if(!item.state)item.title=$('#resourceTitle'+i).value.trim();if(!item.title||item.title.length>300||item.file.size<1||!fileAccept.split(',').some(ext=>item.file.name.toLowerCase().endsWith(ext))){status(item,'표시 이름과 지원 파일 형식을 확인해 주세요.');invalid=true;}});if(invalid)return;
 $('#resourceFile').disabled=true;queue.forEach((_,i)=>$('#resourceTitle'+i).disabled=true);
 const completed=await runTask(async()=>{if(demo)throw new Error('게시된 관리자 화면에서 이용해 주세요.');const call=async(path,options={})=>{const response=await fetch('/api/upload/'+path,{method:'POST',credentials:'same-origin',...options});let result;try{result=await response.json();}catch{throw new Error('업로드 연결을 확인해 주세요.');}if(!response.ok||!result.ok)throw new Error(result.error||'파일 전송이 중단됐습니다.');return result;};return uploadResourceBatch(queue,courseId,call,(item,text)=>{status(item,text);$('#uploadProgress').textContent=(queue.indexOf(item)+1)+' / '+queue.length+' · '+item.file.name;},result=>{data=result.data;revision=result.revision;});});
 if(completed===queue.length){closeDialog();render();message(queue.length+'개 교재 파일을 올렸습니다.');return;}
 $('#resourceFile').disabled=false;queue.forEach((item,i)=>$('#resourceTitle'+i).disabled=Boolean(item.state||item.done));$('#uploadProgress').textContent=queue.filter(item=>item.done).length+' / '+queue.length+'개 완료. 실패한 파일은 다시 올리기로 이어서 시도할 수 있습니다.';$('#uploadSubmit').textContent='실패한 파일 다시 올리기';
 };
}
function confirmAction(title,text,action){openDialog(title,`<p>${esc(text)}</p><div class="actions" style="margin-top:20px"><button data-close>취소</button><button class="primary" id="confirmAction">확인</button></div>`);$('#confirmAction').onclick=async()=>{if(busy)return;if(await action()){closeDialog();render();}};}
async function loadBackups(){const files=await runTask(()=>rpc('listBackups'));if(!files)return;$('#backups').innerHTML=files.length?files.map(f=>`<div class="admin-row"><div><strong>${esc(f.name)}</strong><small>${esc(new Date(f.date).toLocaleString('ko-KR'))}</small></div><button data-backup-restore="${esc(f.id)}">이 백업으로 복원</button></div>`).join(''):'<div class="empty">백업이 없습니다.</div>';}
$('#app').onclick=async e=>{const b=e.target.closest('button');if(!b||busy)return;const ds=b.dataset;
 if(ds.notice)showNotice(ds.notice);if(ds.course){openUnits.clear();navigate({course:ds.course});}if(ds.category){category=ds.category;render();}if(ds.play)openVideo(ds.play);if(ds.copyLesson)share(address({course:data.lessons.find(x=>x.id===ds.copyLesson)?.courseId,lesson:ds.copyLesson}));if(ds.copyAssignment)share(address({assignment:ds.copyAssignment}));if(ds.tab){adminTab=ds.tab;render();}if('uploadResource'in ds)uploadResourceDialog();if(ds.add)edit(ds.add,null,ds.unitId);if(ds.edit)edit(ds.edit,ds.id);if('editRules'in ds)edit('rules');
 if(ds.hide){const next=structuredClone(data);const x=next[ds.hide].find(x=>x.id===ds.id);x.hidden=!x.hidden;if(await save(next))render();}
 if(ds.trash){confirmAction('휴지통으로 이동','학생 화면에서 숨깁니다. 과목·단원 안의 자료도 함께 보이지 않으며, 휴지통에서 복구할 수 있습니다.',async()=>{const next=structuredClone(data);next[ds.trash].find(x=>x.id===ds.id).deletedAt=new Date().toISOString();return save(next);});}
 if(ds.restore){const next=structuredClone(data);const x=next[ds.restore].find(x=>x.id===ds.id);const parent=ds.restore==='lessons'?next.units.find(u=>u.id===x.unitId):['units','resources'].includes(ds.restore)?next.courses.find(c=>c.id===x.courseId):null;if(parent?.deletedAt){message('상위 과목 또는 단원을 먼저 복구해 주세요.');return;}x.deletedAt='';if(await save(next))render();}
 if(ds.move){const next=structuredClone(data),x=next[ds.move].find(x=>x.id===ds.id),group=sort(next[ds.move].filter(y=>alive(y)&&(ds.move==='courses'?y.category===x.category:ds.move==='units'?y.courseId===x.courseId:y.unitId===x.unitId))),i=group.findIndex(y=>y.id===x.id),j=i+Number(ds.direction);if(j<0||j>=group.length)return;[group[i],group[j]]=[group[j],group[i]];group.forEach((y,n)=>y.sortOrder=n);if(await save(next))render();}
 if(ds.backupRestore)confirmAction('전체 자료 복원','현재 자료를 먼저 백업한 뒤, 선택한 백업의 강의·공지·숙제로 교체합니다.',async()=>{const r=await runTask(()=>rpc('restoreBackup',ds.backupRestore,revision));if(!r)return false;data=r.data;revision=r.revision;message('복원했습니다.');return true;});};
// Close video only when both the press and click happen on the backdrop.
let videoBackdropPress=false;
function outsideDialog(e){const r=$('#modal').getBoundingClientRect();return e.target===$('#modal')&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom);}
